# Builds the showcase website (website/) and its live demo and deploys them to GitHub Pages.
# Manual only: run it from the Actions tab once the site has been reviewed.
name: Website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The live demo's Home Assistant cards bundle (scripts/build-ha-cards.mjs) is kept when its inputs are unchanged.
      - uses: actions/cache@v4
        with:
          path: dist/live-demo-public/ha-cards
          key: ha-cards-${{ hashFiles('packaging/ha-cards/**', 'scripts/build-ha-cards.mjs') }}
      # Builds the HA cards bundle and the live demo data, then the website and its live demo.
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
