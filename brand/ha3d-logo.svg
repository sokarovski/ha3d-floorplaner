<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>HA3D</title>
  <g stroke-linejoin="round" stroke-width="18">
    <!-- left roof plane (top) -->
    <polygon points="60,250 150,190 310,30 220,90" fill="#5CCFF6" stroke="#5CCFF6"/>
    <!-- right roof plane -->
    <polygon points="380,250 470,190 310,30 220,90" fill="#0C86BE" stroke="#0C86BE"/>
    <!-- right side wall -->
    <polygon points="380,480 470,420 470,190 380,250" fill="#0A6FA0" stroke="#0A6FA0"/>
    <!-- front face -->
    <polygon points="60,480 380,480 380,250 220,90 60,250" fill="#1FB6EE" stroke="#1FB6EE"/>
  </g>
  <!-- floor plan symbol -->
  <g fill="none" stroke="#F2F4F8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 270 H290 V420 H150 Z"/>
    <path d="M232 270 V330"/>
    <path d="M232 375 V420"/>
    <path d="M150 345 H195"/>
  </g>
</svg>
