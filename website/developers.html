<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developers: Homeplan</title>
    <meta
      name="description"
      content="Run Homeplan from source, use DEV MODE against Home Assistant, build the releases and contribute to the project."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="../brand/ha3d-logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homeplan" />
    <meta property="og:title" content="Developers: Homeplan" />
    <meta property="og:description" content="Run Homeplan from source, DEV MODE and how to contribute." />
    <meta property="og:url" content="https://sokarovski.github.io/ha3d-floorplaner/developers.html" />
    <script>
      // Follow the system light/dark preference with the builder's theme tokens (data-ui-root + data-theme),
      // before the first paint. The site has no theme setting of its own.
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          root.setAttribute("data-theme", query.matches ? "dark" : "light");
        };
        root.setAttribute("data-ui-root", "");
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Homeplan for developers: running from source, DEV MODE and contributing. See the source and
        documentation at
        <a href="https://github.com/sokarovski/ha3d-floorplaner">github.com/sokarovski/ha3d-floorplaner</a>.
      </p>
    </noscript>
    <script type="module" src="./src/developers.tsx"></script>
  </body>
</html>
