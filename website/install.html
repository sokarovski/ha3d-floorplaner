<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install Homeplan</title>
    <meta
      name="description"
      content="How to install Homeplan: the Home Assistant app with the Marketplace integration, the builder on your own computer, or a manual integration install, and how to update."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="../brand/ha3d-logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homeplan" />
    <meta property="og:title" content="Install Homeplan" />
    <meta property="og:description" content="Every way to install Homeplan, step by step." />
    <meta property="og:url" content="https://sokarovski.github.io/ha3d-floorplaner/install.html" />
    <script>
      // Follow the system light/dark preference with the builder's theme tokens (data-ui-root + data-theme),
      // before the first paint. The site has no theme setting of its own.
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          root.setAttribute("data-theme", query.matches ? "dark" : "light");
        };
        root.setAttribute("data-ui-root", "");
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Homeplan: install the Home Assistant app and integration, or run the builder yourself. See the source
        and documentation at
        <a href="https://github.com/sokarovski/ha3d-floorplaner">github.com/sokarovski/ha3d-floorplaner</a>.
      </p>
    </noscript>
    <script type="module" src="./src/install.tsx"></script>
  </body>
</html>
