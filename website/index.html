<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeplan: your home in 3D, in Home Assistant</title>
    <meta
      name="description"
      content="Homeplan lets you draw a measured 3D model of your home, keep a saved history of every version, and use it in Home Assistant to see and control your devices room by room."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="../brand/ha3d-logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homeplan" />
    <meta property="og:title" content="Homeplan: your home in 3D, in Home Assistant" />
    <meta
      property="og:description"
      content="Draw measured rooms, arrange furniture and lighting, and connect your model to Home Assistant to see device states and control your home in context."
    />
    <meta property="og:url" content="https://sokarovski.github.io/ha3d-floorplaner/" />
    <script>
      // Follow the system light/dark preference with the builder's theme tokens (data-ui-root + data-theme),
      // before the first paint. The site has no theme setting of its own.
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          root.setAttribute("data-theme", query.matches ? "dark" : "light");
        };
        root.setAttribute("data-ui-root", "");
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Homeplan: build your home in 3D and bring it into Home Assistant. See the source and documentation at
        <a href="https://github.com/sokarovski/ha3d-floorplaner">github.com/sokarovski/ha3d-floorplaner</a>.
      </p>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
